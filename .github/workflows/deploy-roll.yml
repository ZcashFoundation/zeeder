# Runs deploy/gcp/seeders.sh --roll for the "Deploy seeders" workflow, which
# passes the fleet identifiers in as secrets.
name: Roll seeders

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: true
      only:
        type: string
        required: true
      ref:
        type: string
        required: true
    secrets:
      FLEET_CONF_JSON:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      GCP_WIF:
        required: true

permissions: {}

jobs:
  roll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # Roll a named commit, not whatever main happens to hold when this starts.
      # A release passes the exact commit it pinned, so two overlapping releases
      # cannot roll each other's digest; a manual dispatch falls back to main.
      # The run's own ref is never used: a release-triggered call carries the
      # tag, whose tree predates the pin.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      # The secrets are masked whole. Mask the identifiers inside them that
      # later steps print on their own.
      - name: Materialize fleet inventory
        env:
          FLEET_CONF_JSON: ${{ secrets.FLEET_CONF_JSON }}
          DEPLOYER_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF }}
        run: |
          umask 077
          jq -j . <<< "$FLEET_CONF_JSON" > "$RUNNER_TEMP/fleet.conf"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/fleet.conf"
          echo "::add-mask::${PROJECT}"
          echo "::add-mask::${SERVICE_ACCOUNT}"
          # google-github-actions/auth exports the project in the deployer's
          # email (name@<project>.iam.gserviceaccount.com) to every later step.
          deployer_domain="${DEPLOYER_SA#*@}"
          echo "::add-mask::${deployer_domain%%.*}"
          # projects/<number>/locations/global/workloadIdentityPools/...
          wif_path="${WIF_PROVIDER#projects/}"
          echo "::add-mask::${wif_path%%/*}"
          # Field 1 is the VM name (see each_selected() in seeders.sh).
          for row in "${SEEDERS[@]}"; do
            echo "::add-mask::${row%%|*}"
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # ubuntu-latest preinstalls dnsutils; this only installs on an image that
      # dropped it, so the usual path skips the slow apt-get update entirely.
      - name: Ensure dig is available
        run: command -v dig >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsutils; }

      - name: Roll the fleet
        env:
          FLEET_CONF_FILE: ${{ runner.temp }}/fleet.conf
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          args=()
          if [ "$DRY_RUN_INPUT" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$ONLY_INPUT" ]; then args+=(--only "$ONLY_INPUT"); fi
          args+=(--roll)
          deploy/gcp/seeders.sh "${args[@]}"
