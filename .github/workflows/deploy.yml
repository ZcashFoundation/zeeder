# Manually dispatched seeder deploy: runs deploy/gcp/seeders.sh --roll from CI.
# Rationale and one-time setup live in docs/operations.md "CI-driven deploy".
name: Deploy seeders

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview gcloud/dig actions without changing the fleet
        type: boolean
        default: true
      only:
        description: Limit the roll to one VM name or ns label (optional)
        type: string
        default: ""
  # release.yml calls this after it pins the published digest. Calling rather
  # than firing an event keeps the chain inside one run: a push or release made
  # with GITHUB_TOKEN does not start a new workflow, so an event-driven chain
  # would stop here silently.
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      only:
        type: string
        default: ""
      ref:
        description: Commit to roll. Defaults to main for a manual dispatch.
        type: string
        default: main

permissions: {}

concurrency:
  group: deploy-seeders
  cancel-in-progress: false
  queue: max

jobs:
  # The fleet inventory and the deployer identity are configuration, not
  # credentials, so they live in variables that stay readable and editable.
  # Variables are not masked, this repository's workflow logs are public, and a
  # step prints its resolved env, with, and run values before any command in it
  # can register a mask. Passing them as secrets into the called workflow makes
  # its runner mask them from job start. They must stay repository or
  # organization variables: this calling job has no environment, so it cannot
  # read one defined only on production.
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-roll.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      only: ${{ inputs.only }}
      ref: ${{ inputs.ref }}
    secrets:
      # One line of JSON: the runner also masks each line of a multi-line
      # secret, and the inventory's closing ")" line would mask every ")".
      FLEET_CONF_JSON: ${{ toJSON(vars.FLEET_CONF) }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WIF: ${{ vars.GCP_WIF }}
